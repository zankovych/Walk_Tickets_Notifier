<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Створити запрошення</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <section class="screen is-active">
    <article class="ticket">
      <div class="t-body">
        <header class="t-head">
          <div class="logo"><span class="logo-mark" aria-hidden="true">✦</span><span data-t="airline"></span></div>
          <div class="t-kind">Генератор</div>
        </header>

        <div class="t-main perf">
          <div class="eyebrow">Для відправника</div>
          <h1>Кого <em>запрошуємо</em>?</h1>

          <label class="field-l" for="name">Ім'я</label>
          <input class="input" id="name" maxlength="40" autocomplete="off" placeholder="Наприклад, Анжела">

          <label class="field-l" for="voc">Як звертатись <span class="field-note">підбирається само, можна виправити</span></label>
          <input class="input" id="voc" maxlength="40" autocomplete="off" placeholder="Анжело">

          <div class="preview">«<span id="pv"></span>, привіт!»</div>

          <label class="check"><input type="checkbox" id="test"> Тестове посилання <span class="field-note">відповіді позначаться 🧪</span></label>
        </div>

        <div class="t-stub perf">
          <div class="f-l">Посилання</div>
          <div class="link-box" id="link"></div>
          <button class="btn btn-primary btn-block" id="copy">Скопіювати посилання</button>
          <div class="make-actions"><a class="link" id="open" target="_blank" rel="noopener">відкрити й перевірити</a></div>
        </div>
      </div>
    </article>
  </section>
</main>

<script src="config.js"></script>
<script src="names.js"></script>
<script>
(function () {
  'use strict';
  var C = window.CONFIG;
  var $ = function (s) { return document.querySelector(s); };
  var name = $('#name'), voc = $('#voc'), test = $('#test');
  var vocTouched = false;

  document.querySelectorAll('[data-t]').forEach(function (el) {
    var v = C[el.getAttribute('data-t')];
    if (v != null) el.textContent = v;
  });

  // Сайт лежить поруч із make.html — посилання веде на ту саму папку
  var base = location.origin + location.pathname.replace(/make\.html$/, '');

  function build() {
    var n = name.value.trim();
    if (!vocTouched) voc.value = window.vocative(n);
    var v = voc.value.trim();

    var p = new URLSearchParams();
    if (n) p.set('to', n);
    // v= додаємо тільки якщо звертання виправили вручну — так посилання коротше
    if (n && v && v !== window.vocative(n)) p.set('v', v);
    if (test.checked) p.set('test', '1');
    var qs = p.toString();
    var url = base + (qs ? '?' + qs : '');

    $('#pv').textContent = n ? (v || n) : C.toVocative;
    $('#link').textContent = decodeURI(url);
    $('#link').title = n ? '' : 'Без імені буде «' + C.to + '» з config.js';
    $('#open').href = url;
    return url;
  }

  name.addEventListener('input', build);
  voc.addEventListener('input', function () { vocTouched = voc.value.trim() !== ''; build(); });
  test.addEventListener('change', build);

  $('#copy').addEventListener('click', function () {
    var url = build(), btn = this;
    var done = function () {
      btn.textContent = 'Скопійовано ✓';
      setTimeout(function () { btn.textContent = 'Скопіювати посилання'; }, 1600);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(done, function () { fallbackCopy(url); done(); });
    } else {
      fallbackCopy(url);
      done();
    }
  });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }

  function updateCuts() {
    var body = $('.t-body'), perf = $('.t-stub.perf');
    body.style.setProperty('--cut', perf.offsetTop + 'px');
  }
  window.addEventListener('resize', updateCuts);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateCuts);

  build();
  updateCuts();
})();
</script>
</body>
</html>
